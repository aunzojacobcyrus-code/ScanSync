<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="logo-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5b5ff4" />
      <stop offset="55%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="logo-scan" x1="0" y1="0" x2="48" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="1" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="48" height="48" rx="14" fill="url(#logo-bg)" />

  <!-- Scanner corners -->
  <path d="M12 18V14C12 12.8954 12.8954 12 14 12H18" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <path d="M30 12H34C35.1046 12 36 12.8954 36 14V18" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <path d="M12 30V34C12 35.1046 12.8954 36 14 36H18" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <path d="M30 36H34C35.1046 36 36 35.1046 36 34V30" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

  <!-- Face Biometrics -->
  <!-- Forehead / eyebrows dots -->
  <circle cx="20" cy="21" r="1.5" fill="#ffffff" />
  <circle cx="28" cy="21" r="1.5" fill="#ffffff" />

  <!-- Nose line & smiling curve / smile mouth -->
  <path d="M24 22V26H25.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M19 29.5C20.5 31.8 27.5 31.8 29 29.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

  <!-- Laser scanning beam -->
  <line x1="10" y1="24" x2="38" y2="24" stroke="url(#logo-scan)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)" />
</svg>
